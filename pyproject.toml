[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knivves"
version = "0.13.0"
description = "A polished local CLI database for folding knife research in Canada."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ryan Forrestall" }]
dependencies = [
  "rich>=13.7.0",
  "typer>=0.12.0",
  "textual>=8.0.0"
]

[project.scripts]
knivves = "knivves.cli:app"

[tool.setuptools.packages.find]
include = ["knivves*"]

[tool.setuptools.package-data]
knivves = ["data/*.json", "tui/*.tcss", "tui/pages/*.tcss"]
